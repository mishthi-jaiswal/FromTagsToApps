<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Inline Elements don't start on a new line. It only takes the width that is necessary to cover the content.-->
    <!--Block-level elements are those that start on a new line and take up the entire width of their container by default. They essentially claim all the horizontal space for themselves, pushing any content that comes after them to a new line.-->

    <p>This is a paragraph -Block element</p>
    <span>this is a span (inline) <a href="https://www.google.com">Google</a></span> 
    <span>this is second span (inline)</span>  
    <a href="https://www.google.com">Google</a>
    <div>
        <span>Hello I am an inline element inside block element</span>
    </div>
    
</body>
</html>
