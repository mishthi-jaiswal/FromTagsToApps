<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fonts, Text, Color properties</title>

    <!--Google fonts linking-->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">     -->


    <style>
        /* https://codepen.io/web-dot-dev/pen/yLojraG     website to see which font looks like what */

        /*--How to use Google fonts
        2 ways - import(inside <style>) and link(inside<head>)*/

        /**Google fonts import- 2 fonts -"baloo bhai" and "poppins"*/ 
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        h1{
            font-family:"Poppins",'Courier New', Courier, monospace;
        }
        p{
            font-family: "Baloo Bhai 2",'Times New Roman', Times, serif;
            font-style: italic;
            font-weight:900; /*for bold*/
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <div>
        <h1> CSS Fonts </h1>
        <p>Leaning about fonts</p>
    </div>

    

    
</body>
</html>
